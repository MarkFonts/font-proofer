name: Deploy to wordproof.app

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:            # fired by wm-primitives on a shared-primitive change
    types: [primitive-updated]

# Serialize deploys: a push-run and a primitive-dispatch run landing together both
# rewrite the same generated files in wordmark — the loser's rebase-retry hits real
# content conflicts. Queue instead of race (never cancel a deploy mid-push).
concurrency:
  group: deploy-wordmark
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive   # pull the wm-primitives shared submodule
      - name: Build against latest wm-primitives (main)
        run: git submodule update --remote shared
      # Pushes with the GITHUB_TOKEN that actions/checkout leaves configured (the job
      # declares contents: write). It used to name secrets.WORDMARK_DEPLOY_TOKEN3, which
      # does not exist in THIS repo -- only TOKEN2 does -- so the URL carried an empty
      # credential and the push succeeded purely because checkout's persisted extraheader
      # overrode it. It worked, but for a reason the file did not state.
      - name: Record the primitives commit that was actually built
        run: |
          # The build above uses --remote, i.e. latest wm-primitives main, NOT the pin in
          # this repo. Without this step the recorded pointer drifts behind what is live,
          # so `git log` here does not tell you what wordmark.nyc is running and a local
          # `npm run build` silently builds a different version than production.
          # Commit the pointer we actually built, so the pin is truthful.
          if git diff --quiet -- shared; then
            echo "submodule pointer already matches the build — nothing to record"
            exit 0
          fi
          SHA=$(git -C shared rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shared
          git commit -m "Bump wm-primitives to ${SHA} (built by deploy) [skip ci]"
          # A queued second run checks out before the first run's bump commit lands, so a
          # bare push is rejected non-fast-forward -- and because this step sits ahead of
          # the build, that bookkeeping failure skipped every remaining step, deploy
          # included. Nothing shipped. Same retry-on-rebase the wordmark push already uses.
          n=0
          until git push origin HEAD:main; do
            n=$((n+1)); [ $n -ge 5 ] && { echo "push failed after 5 attempts"; exit 1; }
            echo "push rejected (attempt $n) -- rebasing on origin/main..."
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 3))
          done

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fails the deploy if chrome has drifted off the scale or the type roles.
      - run: node shared/scripts/lint-tokens.mjs
      # Root build for wordproof.app. Plain `npm run build` stays at /font-proofer/ on
      # purpose: wm-primitives' consumers.yml builds this repo that way and serves it at
      # that path for the behaviour tests that gate every dispatch (vite.config.js, BASE).
      - run: npm run build
        env:
          FONT_PROOFER_BASE: /

      # Cloudflare Pages, project "wordproof", custom domain wordproof.app.
      # CLOUDFLARE_API_TOKEN: an API token with Account > Cloudflare Pages > Edit.
      # The account ID is an identifier, not a credential.
      - name: Create the Pages project on the first run
        run: |
          if npx --yes wrangler@3 pages project list 2>/dev/null | grep -qw wordproof; then
            echo "project wordproof exists"
          else
            npx --yes wrangler@3 pages project create wordproof --production-branch=main
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 84c4ef01aa5edb13e0502327c99e5807
      - name: Deploy to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 84c4ef01aa5edb13e0502327c99e5807
          command: pages deploy dist --project-name=wordproof --branch=main --commit-dirty=true

      # EVAL.md D4 + D5: pushed is not shipped. Wait for wordproof.app itself to serve the
      # bundle THIS run built, and record which wm-primitives commit it came from, so the
      # run log is the answer to "what is live?". Only then does wordmark.nyc start
      # forwarding: forwarding before wordproof.app serves the app would send visitors
      # to a domain that still points back at wordmark.nyc.
      - name: wordproof.app serves what this run built
        run: |
          want=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          pin=$(git -C shared rev-parse --short HEAD)
          echo "built $want from wm-primitives $pin (preview: ${{ steps.pages.outputs.deployment-url }})"
          for i in $(seq 1 30); do
            got=$(curl -fsS "https://wordproof.app/?v=$GITHUB_SHA-$i" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)
            if [ "$got" = "$want" ]; then
              echo "live after ~$((i*20))s: $want" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "built from wm-primitives $pin" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 20
          done
          echo "::error::10 minutes after the deploy, wordproof.app serves ${got:-nothing}; this run built $want. Pushed is not shipped."
          exit 1

      # wordmark.nyc/font-proofer/ becomes forwarders, one per route, plus the site-wide
      # 404.html for every other /font-proofer/ path (scripts/write-forwarders.mjs).
      - name: Push the forwarders to wordmark
        env:
          TOKEN: ${{ secrets.WORDMARK_DEPLOY_TOKEN2 }}
        run: |
          git clone https://MarkFonts:${TOKEN}@github.com/MarkFonts/wordmark.git wordmark-repo
          rm -rf wordmark-repo/font-proofer
          node scripts/write-forwarders.mjs dist wordmark-repo/font-proofer
          cp scripts/wordmark-404.html wordmark-repo/404.html
          cd wordmark-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://MarkFonts:${TOKEN}@github.com/MarkFonts/wordmark.git
          git add -A font-proofer/ 404.html
          if git diff --staged --quiet; then echo "forwarders unchanged"; exit 0; fi
          git commit -m "font-proofer: forward to wordproof.app"
          # Retry with rebase: the ReCal deploy also pushes into this repo. We only touch
          # font-proofer/ + 404.html, so a rebase never conflicts.
          n=0
          until git push; do
            n=$((n+1)); [ $n -ge 5 ] && { echo "push failed after 5 attempts"; exit 1; }
            echo "push rejected (attempt $n) — rebasing on origin/main…"
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 3))
          done

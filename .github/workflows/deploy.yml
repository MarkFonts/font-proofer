name: Deploy to Wordmark

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:            # fired by wm-primitives on a shared-primitive change
    types: [primitive-updated]

# Serialize deploys: a push-run and a primitive-dispatch run landing together both
# rewrite the same generated files in wordmark — the loser's rebase-retry hits real
# content conflicts. Queue instead of race (never cancel a deploy mid-push).
concurrency:
  group: deploy-wordmark
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive   # pull the wm-primitives shared submodule
      - name: Build against latest wm-primitives (main)
        run: git submodule update --remote shared
      # Pushes with the GITHUB_TOKEN that actions/checkout leaves configured (the job
      # declares contents: write). It used to name secrets.WORDMARK_DEPLOY_TOKEN3, which
      # does not exist in THIS repo -- only TOKEN2 does -- so the URL carried an empty
      # credential and the push succeeded purely because checkout's persisted extraheader
      # overrode it. It worked, but for a reason the file did not state.
      - name: Record the primitives commit that was actually built
        run: |
          # The build above uses --remote, i.e. latest wm-primitives main, NOT the pin in
          # this repo. Without this step the recorded pointer drifts behind what is live,
          # so `git log` here does not tell you what wordmark.nyc is running and a local
          # `npm run build` silently builds a different version than production.
          # Commit the pointer we actually built, so the pin is truthful.
          if git diff --quiet -- shared; then
            echo "submodule pointer already matches the build — nothing to record"
            exit 0
          fi
          SHA=$(git -C shared rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shared
          git commit -m "Bump wm-primitives to ${SHA} (built by deploy) [skip ci]"
          # A queued second run checks out before the first run's bump commit lands, so a
          # bare push is rejected non-fast-forward -- and because this step sits ahead of
          # the build, that bookkeeping failure skipped every remaining step, deploy
          # included. Nothing shipped. Same retry-on-rebase the wordmark push already uses.
          n=0
          until git push origin HEAD:main; do
            n=$((n+1)); [ $n -ge 5 ] && { echo "push failed after 5 attempts"; exit 1; }
            echo "push rejected (attempt $n) -- rebasing on origin/main..."
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 3))
          done

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fails the deploy if chrome has drifted off the scale or the type roles.
      - run: node shared/scripts/lint-tokens.mjs
      - run: npm run build

      - name: Push to wordmark repo
        env:
          TOKEN: ${{ secrets.WORDMARK_DEPLOY_TOKEN2 }}
        run: |
          git clone https://MarkFonts:${TOKEN}@github.com/MarkFonts/wordmark.git wordmark-repo
          rm -rf wordmark-repo/font-proofer
          cp -r dist wordmark-repo/font-proofer
          cp scripts/wordmark-404.html wordmark-repo/404.html
          cd wordmark-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://MarkFonts:${TOKEN}@github.com/MarkFonts/wordmark.git
          git add font-proofer/ 404.html
          git diff --staged --quiet || git commit -m "Deploy font-proofer"
          # Retry with rebase: the font-proofer and ReCal deploys both push into this
          # repo and can collide. We only touch font-proofer/ + 404.html, so a rebase
          # never conflicts. (Fixes the 2026-07-23 'fetch first' rejection.)
          n=0
          until git push; do
            n=$((n+1)); [ $n -ge 5 ] && { echo "push failed after 5 attempts"; exit 1; }
            echo "push rejected (attempt $n) — rebasing on origin/main…"
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 3))
          done

      # EVAL.md D4 + D5: pushed is not shipped. The push above lands in a repo; Pages
      # builds it later, or not, and nothing here used to notice. This waits for the
      # site to serve the bundle THIS run built, and records which wm-primitives commit
      # it was built from, so the run log is the answer to "what is live?".
      - name: The site serves what this run built
        run: |
          want=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' dist/index.html | head -1)
          pin=$(git -C shared rev-parse --short HEAD)
          echo "built $want from wm-primitives $pin"
          for i in $(seq 1 30); do
            got=$(curl -fsS "https://wordmark.nyc/font-proofer/?v=$GITHUB_SHA-$i" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)
            if [ "$got" = "$want" ]; then
              echo "live after ~$((i*20))s: $want" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "built from wm-primitives $pin" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # A later run of this app may already have replaced ours in the repo. That
            # is not a failure of this run -- but it must be said, not passed silently.
            repo=$(curl -fsS "https://raw.githubusercontent.com/MarkFonts/wordmark/main/font-proofer/index.html?v=$GITHUB_SHA-$i" | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1 || true)
            if [ -n "$repo" ] && [ "$repo" != "$want" ]; then
              echo "::notice::superseded: wordmark carries $repo, newer than this run's $want"
              exit 0
            fi
            sleep 20
          done
          echo "::error::10 minutes after the push, wordmark.nyc/font-proofer/ serves ${got:-nothing}; this run built $want. Pushed is not shipped."
          exit 1
